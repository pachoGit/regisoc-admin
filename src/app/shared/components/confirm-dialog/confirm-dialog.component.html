@if (confirmService.pending(); as dialog) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-xs"
    role="alertdialog"
    aria-modal="true"
    (click)="confirmService.cancel()"
  >
    <div
      class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-xl"
      (click)="$event.stopPropagation()"
    >
      <h3 class="text-base font-semibold text-slate-900">{{ dialog.title }}</h3>
      <p class="mt-2 text-sm text-slate-600">{{ dialog.message }}</p>

      <div class="mt-6 flex items-center justify-end gap-2.5">
        <button
          type="button"
          class="rs-btn rs-btn-secondary"
          (click)="confirmService.cancel()"
        >
          {{ dialog.cancelText }}
        </button>
        <button
          type="button"
          [class]="confirmButtonClass(dialog.variant)"
          (click)="confirmService.accept()"
        >
          {{ dialog.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
