@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-xs"
    role="dialog"
    aria-modal="true"
    (click)="closed.emit()"
  >
    <div
      class="rs-modal-panel flex max-h-[90vh] w-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl"
      [class]="maxWidthClass()"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-4 border-b border-slate-100 px-6 py-4">
        <div>
          <h2 class="text-lg font-semibold text-slate-900">{{ title() }}</h2>
          @if (subtitle()) {
            <p class="mt-0.5 text-xs text-slate-500">{{ subtitle() }}</p>
          }
        </div>
        <button
          type="button"
          class="rounded-lg p-1.5 text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600 cursor-pointer"
          aria-label="Cerrar"
          (click)="closed.emit()"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="overflow-y-auto px-6 py-5">
        <ng-content />
      </div>
    </div>
  </div>
}
