<div
  class="no-print pointer-events-none fixed right-4 bottom-4 z-50 flex w-full max-w-sm flex-col gap-2.5"
  aria-live="polite"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="rs-toast pointer-events-auto relative flex items-start gap-3 overflow-hidden rounded-xl border p-4 shadow-lg"
      [class]="toneClass(toast.type)"
    >
      <span class="absolute inset-y-0 left-0 w-1" [class]="accentClass(toast.type)"></span>
      <div class="min-w-0 flex-1 pl-1">
        <p class="text-sm font-semibold text-slate-900">{{ toast.title }}</p>
        @if (toast.message) {
          <p class="mt-0.5 text-xs text-slate-600">{{ toast.message }}</p>
        }
      </div>
      <button
        type="button"
        class="rounded-md p-1 text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600 cursor-pointer"
        aria-label="Cerrar notificación"
        (click)="toastService.dismiss(toast.id)"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
